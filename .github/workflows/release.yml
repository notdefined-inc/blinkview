name: Release

# Installers are built where they are meant to run. Cross-compiling a Tauri app is a
# fight nobody wins: each platform needs its own webview and its own bundler.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: aarch64-apple-darwin
            name: macOS (Apple Silicon)
          # No Intel Mac build. `ort` ships prebuilt ONNX Runtime for eight targets
          # and x86_64-apple-darwin is not among them, because Microsoft stopped
          # publishing a macOS x64 build of ONNX Runtime — every release since
          # v1.27.0 carries osx-arm64 alone. The only route left is compiling ONNX
          # Runtime from source in CI, which is what upstream itself gave up on.
          # 24.04 is the floor, not a preference: the prebuilt onnxruntime `ort`
          # fetches needs glibc 2.38+. The Linux packages therefore require a
          # distribution of that vintage or newer, which the README says.
          - platform: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            name: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            name: Windows

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.platform }}

    # The repository hands workflows a read-only token by default, which builds
    # four installers fine and then cannot create the release to put them in.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libgtk-3-dev \
            pkg-config nasm

      # ffmpeg's configure finds libx264 only through pkg-config, and x264's x86
      # assembly needs nasm. The runners have neither reliably.
      - name: ffmpeg build dependencies (macOS)
        if: startsWith(matrix.platform, 'macos')
        run: brew install pkg-config nasm

      - name: ffmpeg build dependencies (Windows)
        if: matrix.platform == 'windows-latest'
        run: choco install -y nasm pkgconfiglite

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # The ONNX and image crates are slow to build; caching turns a 12 minute job
      # into a 3 minute one on everything but the first run.
      - uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # The bundled ffmpeg (ADR-0014). Keyed on the lockfile, so it is compiled once
      # per pinned version and restored on every release after that.
      - name: Cache the bundled ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: ffmpeg-${{ matrix.target }}-${{ hashFiles('tools/ffmpeg.lock') }}

      # Must precede `tauri build`: externalBin is required at build time, so the app
      # does not compile without it.
      - name: Build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        shell: bash
        run: ./tools/build-ffmpeg.sh

      - name: Check the bundled ffmpeg
        shell: bash
        run: |
          set -euo pipefail
          BIN=$(ls apps/desktop/src-tauri/binaries/ffmpeg-* | head -1)
          ls -l "$BIN"
          # Criterion 8: under 40 MB per platform.
          SIZE=$(( $(wc -c < "$BIN") / 1048576 ))
          echo "bundled ffmpeg: ${SIZE} MB"
          [ "$SIZE" -lt 40 ] || { echo "over the 40 MB budget"; exit 1; }
          # Criterion 7: the formats the spec names must actually be there.
          for c in h264 hevc vp8 vp9 av1 mpeg2video mpeg4 mjpeg prores vc1 theora dvvideo wmv3 \
                   aac mp3 opus vorbis flac ac3 eac3 wmav2 png; do
            "$BIN" -hide_banner -decoders 2>/dev/null | grep -qE "^ *[A-Z.]+ +$c\b" \
              || { echo "missing decoder: $c"; exit 1; }
          done
          for c in libx264 aac mjpeg png; do
            "$BIN" -hide_banner -encoders 2>/dev/null | grep -qE "^ *[A-Z.]+ +$c\b" \
              || { echo "missing encoder: $c"; exit 1; }
          done
          for d in mov matroska avi mpegts flv asf ogg; do
            "$BIN" -hide_banner -demuxers 2>/dev/null | grep -qE "^ *[A-Z ]+ *$d\b" \
              || { echo "missing demuxer: $d"; exit 1; }
          done
          echo "all required codecs and containers present"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          # The `--` matters: everything after it goes to cargo, and without it
          # `tauri build` rejects --no-default-features as its own unknown flag.
          # The UI-verification bridge opens a WebSocket and is compiled out of any
          # build that ships.
          args: --target ${{ matrix.target }} -- --no-default-features
          tagName: ${{ github.ref_name }}
          releaseName: "OpenFoto ${{ github.ref_name }}"
          releaseBody: |
            Installers for macOS, Windows and Linux are attached below. The macOS
            build is Apple Silicon only: ONNX Runtime no longer ships a macOS x64
            build, so an Intel Mac would need it compiled from source.

            The app is ad-hoc signed but not notarized. On macOS, right-click the app
            and choose Open; on Windows, choose *More info* → *Run anyway*. If macOS
            refuses outright, `xattr -cr /Applications/OpenFoto.app` clears the
            download quarantine flag.

            Face recognition and scene search need about 200 MB of models, downloaded
            on first use and verified against a pinned SHA-256. Everything else works
            without them.
          releaseDraft: true
          prerelease: false
