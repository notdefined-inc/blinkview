name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Tests and lints
    # 24.04, not 22.04: `ort` downloads a prebuilt onnxruntime linked against
    # glibc 2.38+, and 22.04 ships 2.35 — linking fails on __isoc23_strtol and
    # friends long before any test runs.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            pkg-config nasm

      # Pinned deliberately. `-D warnings` against a moving toolchain means a clippy
      # release can fail a pull request that changed nothing — which is exactly how
      # this workflow first went red. Bump it on purpose, not by surprise.
      - uses: dtolnay/rust-toolchain@1.90.0
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2

      # The desktop crate declares ffmpeg as a Tauri externalBin, which is required at
      # build time — so a plain `cargo clippy --workspace` needs it too, not just the
      # release bundle. Keyed on the lockfile: compiled once per pinned version.
      - name: Cache the bundled ffmpeg
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: apps/desktop/src-tauri/binaries
          key: ffmpeg-x86_64-unknown-linux-gnu-${{ hashFiles('tools/ffmpeg.lock') }}

      - name: Build ffmpeg
        if: steps.ffmpeg-cache.outputs.cache-hit != 'true'
        run: ./tools/build-ffmpeg.sh

      # --all-targets is not optional: without it clippy skips test targets and will
      # report a clean workspace while a test fails to compile.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

      # The frontend has no build step, so its tests run the shipped file directly.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node apps/desktop/tests/grammar.test.mjs
