<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openfoto — who is this?</title>
<style>
:root{
  --bg:#0b0b0e; --surface:#141419; --surface-2:#1c1c23; --line:#2a2a33;
  --text:#f2f2f5; --text-dim:#a1a1ad; --text-faint:#6e6e7a;
  --accent:#7c9cff; --accent-ink:#0b0b0e;
  --ok:#4ade80; --warn:#fbbf24; --danger:#f87171;
  --r:8px; --r-lg:14px; --r-pill:999px;
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s6:24px; --s8:32px; --s12:48px;
  --ease:cubic-bezier(.2,.7,.3,1);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg); color:var(--text);
  font:16px/1.5 ui-sans-serif,-apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-font-smoothing:antialiased;
}
:focus-visible{outline:2px solid var(--accent); outline-offset:2px; border-radius:var(--s1)}
.num{font-variant-numeric:tabular-nums}
button{font:inherit; cursor:pointer; border:0; background:none; color:inherit}

/* ---------- top bar ---------- */
header{
  position:sticky; top:0; z-index:20; background:rgba(11,11,14,.82);
  backdrop-filter:saturate(1.4) blur(16px); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:var(--s4); padding:var(--s3) var(--s6);
}
.brand{display:flex; align-items:center; gap:var(--s2); font-weight:600; letter-spacing:-.01em}
.brand-dot{width:9px;height:9px;border-radius:var(--r-pill);background:var(--accent);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 18%,transparent)}
.divider{width:1px;height:20px;background:var(--line)}
h1{font-size:16px;font-weight:600;margin:0;letter-spacing:-.01em}
.hint{font-size:12px;color:var(--text-faint)}
.spacer{flex:1}
.progress{display:flex;align-items:center;gap:var(--s3);font-size:12px;color:var(--text-faint)}
.bar{width:120px;height:4px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden}
.bar span{display:block;height:100%;width:0;background:var(--accent);transition:width .35s var(--ease)}
.btn{padding:var(--s2) var(--s4); font-size:14px; border-radius:var(--r);
  background:var(--surface-2); color:var(--text); border:1px solid var(--line)}
.btn:hover:not(:disabled){background:#24242d}
.btn-primary{background:var(--accent); color:var(--accent-ink); font-weight:600; border-color:transparent}
.btn-primary:hover:not(:disabled){filter:brightness(1.08)}
.btn:disabled{opacity:.4; cursor:not-allowed}

/* ---------- grid of people ---------- */
.grid{
  padding:var(--s6);
  display:grid; gap:var(--s4);
  grid-template-columns:repeat(auto-fill,minmax(228px,1fr));
}
.card{
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg);
  overflow:hidden; display:flex; flex-direction:column;
  transition:border-color .2s var(--ease), transform .2s var(--ease);
}
.card:hover{transform:translateY(-2px); border-color:#39394633}
.card[data-state="named"]{border-color:color-mix(in srgb,var(--ok) 50%,var(--line))}
.card[data-state="skipped"]{opacity:.5}

.hero{position:relative; aspect-ratio:1; background:var(--surface-2)}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
.hero::after{
  content:""; position:absolute; inset:auto 0 0 0; height:56%;
  background:linear-gradient(to top,rgba(0,0,0,.72),transparent); pointer-events:none;
}
.count{
  position:absolute; left:var(--s3); bottom:var(--s3); z-index:1;
  font-size:12px; color:#fff; text-shadow:0 1px 3px rgba(0,0,0,.6);
}
.tick{
  position:absolute; right:var(--s3); top:var(--s3); z-index:1;
  width:22px;height:22px;border-radius:var(--r-pill); background:var(--ok); color:#06210f;
  display:none; align-items:center; justify-content:center; font-size:13px; font-weight:700;
}
.card[data-state="named"] .tick{display:flex}

.thumbs{display:flex; gap:2px; padding:2px; background:var(--surface)}
.thumbs img{
  flex:1 1 0; min-width:0; aspect-ratio:1; object-fit:cover;
  border-radius:3px; display:block; opacity:.82;
  transition:opacity .15s var(--ease);
}
.thumbs img:hover{opacity:1}

.body{padding:var(--s3); display:flex; flex-direction:column; gap:var(--s2)}
.suggest{font-size:12px; display:flex; align-items:center; gap:var(--s2); min-height:18px}
.dot{width:6px;height:6px;border-radius:var(--r-pill);background:var(--text-faint);flex:0 0 auto}
.dot[data-c="ok"]{background:var(--ok)} .dot[data-c="warn"]{background:var(--warn)}
.suggest .who{color:var(--text-dim)}
.suggest .sim{color:var(--text-faint)}

/* name field styled as text until touched — the primary action */
.name{
  width:100%; font:inherit; font-size:15px; font-weight:600; color:var(--text);
  background:transparent; border:1px solid transparent; border-radius:var(--r);
  padding:var(--s2) var(--s3); margin:0; transition:background .15s var(--ease);
}
.name::placeholder{color:var(--text-faint); font-weight:500}
.name:hover{background:var(--surface-2)}
.name:focus{background:var(--surface-2); border-color:var(--accent); outline:none}

.row{display:flex; gap:var(--s2); flex-wrap:wrap}
.chip{
  font-size:12px; padding:5px var(--s3); border-radius:var(--r-pill);
  background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim);
}
.chip:hover{background:#24242d; color:var(--text)}
.chip[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:600}
.chip.echo{
  background:color-mix(in srgb,var(--accent) 16%,transparent);
  border-color:color-mix(in srgb,var(--accent) 45%,transparent); color:var(--accent);
}
.chip.echo:hover{background:color-mix(in srgb,var(--accent) 26%,transparent)}
.chip.ghost{border-style:dashed}
.chip.ghost[aria-pressed="true"]{background:transparent; color:var(--text); border-color:var(--text-faint); border-style:solid}

/* ---------- states ---------- */
.empty{
  grid-column:1/-1; border:1px dashed var(--line); border-radius:var(--r-lg);
  padding:var(--s12); text-align:center; color:var(--text-dim);
}
.empty h2{margin:0 0 var(--s2); font-size:20px; color:var(--text); font-weight:600}
.empty p{margin:0 auto; max-width:56ch}
.toast{
  position:fixed; left:50%; bottom:var(--s6); transform:translateX(-50%);
  background:var(--surface-2); border:1px solid var(--line); border-radius:var(--r);
  padding:var(--s3) var(--s4); font-size:14px; box-shadow:0 12px 40px rgba(0,0,0,.6); z-index:50;
}
.toast[data-kind="error"]{border-color:var(--danger); color:var(--danger)}
.toast[data-kind="ok"]{border-color:var(--ok)}
footer{padding:0 var(--s6) var(--s8); color:var(--text-faint); font-size:12px}
kbd{
  font:inherit; font-size:11px; padding:1px 5px; border-radius:4px;
  background:var(--surface-2); border:1px solid var(--line); color:var(--text-dim);
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header>
  <div class="brand"><span class="brand-dot"></span>openfoto</div>
  <div class="divider"></div>
  <div>
    <h1>Who is this?</h1>
    <div class="hint" id="hint">—</div>
  </div>
  <div class="spacer"></div>
  <div class="progress">
    <span id="ptext">0 named</span>
    <div class="bar"><span id="pbar"></span></div>
  </div>
  <button class="btn" id="reset">Reset</button>
  <button class="btn btn-primary" id="save" disabled>Save</button>
</header>

<div class="grid" id="grid"></div>
<footer>
  Nothing moves until you save. Unnamed groups stay exactly where they are.
  Press <kbd>Enter</kbd> in a name box to jump to the next unnamed person.
</footer>

<script>
const DATA = window.__REVIEW__;
const chosen = new Map();          // id -> name ("" = explicitly skipped)

const el = (t, a = {}, ...kids) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (v === null || v === undefined) continue;
    if (k === "class") n.className = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v);
  }
  for (const c of kids.flat()) if (c !== null && c !== undefined) n.append(c.nodeType ? c : String(c));
  return n;
};

function conf(c) {
  if (c.similarity === null || c.similarity === undefined) return ["none", null];
  if (c.ambiguous) return ["warn", "too close to call"];
  return [c.similarity >= 0.5 ? "ok" : "none", c.similarity.toFixed(2)];
}

function card(c) {
  const [cls, simText] = conf(c);
  const hero = c.faces[0];
  const rest = c.faces.slice(1, 6);

  const input = el("input", {
    class: "name", type: "text", value: "",
    placeholder: c.suggestion && cls === "ok" ? c.suggestion : "Add a name",
    "aria-label": `Name for person group ${c.id}`,
    oninput: e => { setChoice(c.id, e.target.value.trim()); },
    onkeydown: e => { if (e.key === "Enter") { e.preventDefault(); nextUnnamed(c.id); } }
  });

  const chips = [];
  if (c.suggestion) {
    chips.push(el("button", {
      class: "chip", "aria-pressed": "false", "data-name": c.suggestion, "data-c": c.id,
      onclick: () => { input.value = c.suggestion; setChoice(c.id, c.suggestion); }
    }, c.suggestion));
  }
  for (const p of DATA.known_people) {
    if (p === c.suggestion) continue;
    chips.push(el("button", {
      class: "chip", "aria-pressed": "false", "data-name": p, "data-c": c.id,
      onclick: () => { input.value = p; setChoice(c.id, p); }
    }, p));
  }
  chips.push(el("button", {
    class: "chip ghost", "aria-pressed": "false", "data-name": "", "data-c": c.id,
    onclick: () => { input.value = ""; setChoice(c.id, "", true); }
  }, "Not a person"));

  return el("div", { class: "card", "data-card": c.id, "data-state": "new" },
    el("div", { class: "hero" },
      hero ? el("img", { src: hero.crop, alt: `Largest face in group ${c.id}`, loading: "lazy" }) : null,
      el("span", { class: "tick" }, "✓"),
      el("span", { class: "count num" }, `${c.photo_count} photo${c.photo_count === 1 ? "" : "s"}`)),
    rest.length ? el("div", { class: "thumbs" },
      rest.map(f => el("img", { src: f.crop, alt: "", loading: "lazy" }))) : null,
    el("div", { class: "body" },
      // With no known people yet, "Someone new" is true of every card and tells the
      // user nothing. Show this row only when it carries information.
      c.suggestion
        ? el("div", { class: "suggest" },
            el("span", { class: "dot", "data-c": cls }),
            el("span", { class: "who" }, `Looks like ${c.suggestion}`),
            simText ? el("span", { class: "sim" }, simText) : null)
        : (DATA.known_people.length
            ? el("div", { class: "suggest" },
                el("span", { class: "dot", "data-c": "none" }),
                el("span", { class: "who" }, "Someone new"))
            : null),
      input,
      el("div", { class: "row" }, chips)));
}

function setChoice(id, name, explicitSkip = false) {
  if (name) chosen.set(id, name);
  else if (explicitSkip) chosen.set(id, "");
  else chosen.delete(id);
  echo();
  paint();
}

const cos = (a, b) => { let s = 0; for (let i = 0; i < a.length; i++) s += a[i] * b[i]; return s; };

/* One person routinely splits across several groups — front-on and in profile embed
   very differently. Rather than making the user find every one of their own groups,
   naming one group offers that name to every other group that looks like them. The
   0.45 floor is deliberately below the 0.50 used for automatic assignment: this only
   ever proposes, and a human is looking straight at it. */
function echo() {
  const named = [...chosen.entries()].filter(([, v]) => v);
  for (const c of DATA.clusters) {
    const holder = document.querySelector(`[data-card="${c.id}"] .row`);
    if (!holder) continue;
    holder.querySelectorAll(".chip.echo").forEach(n => n.remove());
    if (chosen.get(c.id) || !c.centroid?.length) continue;

    const best = new Map();
    for (const [oid, name] of named) {
      if (oid === c.id) continue;
      const other = DATA.clusters.find(x => x.id === oid);
      if (!other?.centroid?.length) continue;
      const s = cos(c.centroid, other.centroid);
      if (s >= 0.45 && s > (best.get(name) ?? 0)) best.set(name, s);
    }
    for (const [name, s] of [...best.entries()].sort((a, b) => b[1] - a[1]).slice(0, 2)) {
      const b = document.createElement("button");
      b.className = "chip echo";
      b.dataset.name = name; b.dataset.c = c.id;
      b.setAttribute("aria-pressed", "false");
      b.textContent = `Also ${name}? ${s.toFixed(2)}`;
      b.onclick = () => {
        const input = document.querySelector(`[data-card="${c.id}"] .name`);
        if (input) input.value = name;
        setChoice(c.id, name);
      };
      holder.prepend(b);
    }
  }
}

function nextUnnamed(after) {
  const ids = DATA.clusters.map(c => c.id);
  const start = ids.indexOf(after) + 1;
  for (let i = start; i < ids.length; i++) {
    if (!chosen.get(ids[i])) {
      const n = document.querySelector(`[data-card="${ids[i]}"] .name`);
      if (n) { n.focus(); n.scrollIntoView({ block: "center", behavior: "smooth" }); return; }
    }
  }
  document.getElementById("save").focus();
}

function paint() {
  for (const b of document.querySelectorAll(".chip")) {
    const id = Number(b.dataset.c);
    const v = chosen.get(id);
    b.setAttribute("aria-pressed", String(v !== undefined && v === b.dataset.name));
  }
  for (const card of document.querySelectorAll(".card")) {
    const v = chosen.get(Number(card.dataset.card));
    card.dataset.state = v ? "named" : (v === "" ? "skipped" : "new");
  }
  const named = [...chosen.values()].filter(Boolean).length;
  const total = DATA.clusters.length;
  document.getElementById("ptext").textContent = `${named} of ${total} named`;
  document.getElementById("pbar").style.width = `${total ? (named / total) * 100 : 0}%`;
  document.getElementById("save").disabled = named === 0;
}

function render() {
  document.getElementById("hint").textContent =
    `${DATA.clusters.length} groups · ${DATA.unassigned_faces} faces to place`;
  const grid = document.getElementById("grid");
  if (!DATA.clusters.length) {
    grid.replaceChildren(el("div", { class: "empty" },
      el("h2", {}, "Everyone here is already named"),
      el("p", {}, "Every face openfoto found belongs to someone you have identified. Add more photos and run openfoto faces analyze to find new people.")));
    document.getElementById("reset").disabled = true;
    return;
  }
  grid.replaceChildren(...DATA.clusters.map(card));
  echo();
  paint();
}

function toast(msg, kind) {
  const t = el("div", { class: "toast", "data-kind": kind, role: "status" }, msg);
  document.body.append(t); setTimeout(() => t.remove(), 6000);
}

document.getElementById("reset").onclick = () => {
  chosen.clear();
  for (const i of document.querySelectorAll(".name")) i.value = "";
  echo();
  paint();
};
document.getElementById("save").onclick = async () => {
  const btn = document.getElementById("save");
  btn.disabled = true; btn.textContent = "Saving…";
  const assignments = {};
  for (const [k, v] of chosen) if (v) assignments[k] = v;
  try {
    const r = await fetch("/save", {
      method: "POST", headers: { "content-type": "application/json" },
      body: JSON.stringify({ assignments })
    });
    if (!r.ok) throw new Error(await r.text());
    btn.textContent = "Saved";
    toast("Saved — back to the terminal.", "ok");
  } catch (e) {
    btn.disabled = false; btn.textContent = "Save";
    toast("Could not save: " + e.message, "error");
  }
};
render();
</script>
</body>
</html>
