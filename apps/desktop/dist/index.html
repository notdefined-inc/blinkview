<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenFoto</title>
<script>
/* Theme must be on <html> before first paint, or the wrong theme flashes. The
   choice is a UI preference, so it lives in localStorage — never in the vault. */
try{document.documentElement.dataset.theme=localStorage.getItem("of-theme")||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){document.documentElement.dataset.theme="dark"}
</script>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="titlebar" data-tauri-drag-region>
  <div class="tb-left">
    <span class="logowrap" aria-hidden="true">
      <img class="logomark" src="logo.png" alt="" width="26" height="26" decoding="async">
    </span>
    <span class="wordmark">OpenFoto</span>
  </div>
  <div class="tb-mid" data-tauri-drag-region>
    <div class="searchwrap">
      <svg class="s-glyph" viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="9" cy="9" r="5.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M13.2 13.2 17 17" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input id="search" class="search" type="search"
             placeholder="Search your photos — a name, a date, or what’s in them" aria-label="Search photos">
      <button class="clearbtn" id="search-clear" type="button" title="Clear search" aria-label="Clear search" hidden>✕</button>
      <button class="s-tool" id="btn-filter" title="Filters" aria-label="Filters">
        <svg viewBox="0 0 20 20" aria-hidden="true">
          <path d="M3 6h14M3 12h14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          <circle cx="13" cy="6" r="2.2" fill="currentColor"/>
          <circle cx="7" cy="12" r="2.2" fill="currentColor"/>
        </svg>
      </button>
      <div class="suggest" id="suggest" hidden></div>
    </div>
  </div>
  <div class="tb-right">
    <button class="askbtn" id="btn-ask" title="Ask in natural language (⌘K)" aria-label="Ask OpenFoto">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 2.5 11.7 7.3 16.5 9 11.7 10.7 10 15.5 8.3 10.7 3.5 9 8.3 7.3Z" fill="currentColor"/>
        <circle cx="16" cy="15.5" r="1.4" fill="currentColor"/>
      </svg>
      <span>Ask</span><kbd>⌘K</kbd>
    </button>
    <button class="icon-btn" id="btn-tools" title="Organize" aria-label="Organize">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <rect x="3" y="3" width="6" height="6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <rect x="11" y="3" width="6" height="6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <rect x="3" y="11" width="6" height="6" rx="1.6" fill="none" stroke="currentColor" stroke-width="1.7"/>
        <path d="M14 11v6M11 14h6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </button>
    <button class="icon-btn" id="btn-theme" title="Switch theme" aria-label="Switch between dark and light mode">
      <svg class="th-moon" viewBox="0 0 20 20" aria-hidden="true">
        <path d="M15.6 12.4A6.1 6.1 0 0 1 7.6 4.4 6.1 6.1 0 1 0 15.6 12.4Z" fill="currentColor"/>
      </svg>
      <svg class="th-sun" viewBox="0 0 20 20" aria-hidden="true">
        <circle cx="10" cy="10" r="3.6" fill="currentColor"/>
        <path d="M10 2v2.2M10 15.8V18M2 10h2.2M15.8 10H18M4.3 4.3l1.6 1.6M14.1 14.1l1.6 1.6M15.7 4.3l-1.6 1.6M5.9 14.1l-1.6 1.6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
      </svg>
    </button>
  </div>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <section class="nav-block">
      <div class="nav-head"><span>Sources</span><button class="mini" id="btn-add" title="Add a folder">＋</button></div>
      <div id="sources"></div>
    </section>
    <section class="nav-block" id="people-block" hidden>
      <div class="nav-head"><span>People</span><button class="mini" id="btn-review" title="Review people">◎</button></div>
      <div id="people"></div>
      <button class="morelink" id="people-toggle" hidden></button>
    </section>
    <section class="nav-block" id="searches-block" hidden>
      <div class="nav-head"><span>Saved searches</span></div>
      <div id="searches"></div>
    </section>
    <section class="nav-block" id="albums-block" hidden>
      <div class="nav-head"><span>Albums (old)</span></div>
      <div id="albums"></div>
    </section>
    <section class="nav-block" id="folders-block" hidden>
      <div class="nav-head"><span>Folders</span><button class="mini" id="btn-newfolder" title="New folder inside the selected one">＋</button></div>
      <div id="folders"></div>
    </section>
    <section class="nav-block" id="trash-block" hidden>
      <div class="nav-head"><span>Trash</span></div>
      <div id="trash"></div>
    </section>
  </aside>

  <main id="main">
    <div class="libhead"><span id="crumb"></span></div>
    <div class="qchips" id="qchips" hidden></div>
    <div class="filters" id="filters" hidden>
      <div class="frow"><span class="flab">People</span><span class="fopts" id="f-people"></span></div>
      <div class="frow"><span class="flab">When</span><span class="fopts" id="f-when"></span></div>
      <div class="frow"><span class="flab">Rating</span><span class="fopts" id="f-rating"></span></div>
      <div class="frow"><span class="flab">Label</span><span class="fopts" id="f-label"></span></div>
      <div class="frow"><span class="flab">Type</span><span class="fopts" id="f-type"></span></div>
      <div class="frow"><span class="flab">Group</span><span class="fopts" id="f-group"></span></div>
      <div class="frow"><span class="flab">Sort</span><span class="fopts" id="f-sort"></span></div>
    </div>
    <div id="stage"></div>
  </main>
</div>

<aside class="askpanel" id="askpanel" hidden aria-label="Ask OpenFoto">
  <div class="ask-head">
    <span class="ask-title">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 2.5 11.7 7.3 16.5 9 11.7 10.7 10 15.5 8.3 10.7 3.5 9 8.3 7.3Z" fill="currentColor"/>
      </svg>
      Ask OpenFoto
    </span>
    <button class="icon-btn" id="ask-close" aria-label="Close">✕</button>
  </div>
  <div class="ask-thread" id="ask-thread"></div>
  <form class="ask-composer" id="ask-form">
    <input id="ask-input" type="text" autocomplete="off"
           placeholder="“Sunset photos from the mountains”…" aria-label="Ask about your photos">
    <button class="ask-send" id="ask-send" type="submit" aria-label="Ask">
      <svg viewBox="0 0 20 20" aria-hidden="true">
        <path d="M10 15V4M5.5 8.5 10 4l4.5 4.5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </form>
</aside>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-chrome lb-top">
    <button class="icon-btn" id="lb-close" aria-label="Close">✕</button>
    <div class="lb-title"><b id="lb-name"></b><span id="lb-meta"></span></div>
    <div class="lb-actions">
      <span class="lb-zoom num" id="lb-zoom"></span>
      <span class="lb-folder" id="lb-folder"></span>
      <button class="icon-btn" id="lb-rot-l" title="Rotate left" aria-label="Rotate left">⟲</button>
      <button class="icon-btn" id="lb-rot-r" title="Rotate right" aria-label="Rotate right">⟳</button>
      <button class="icon-btn" id="lb-flip" title="Flip horizontally" aria-label="Flip horizontally">⇋</button>
      <button class="icon-btn" id="lb-crop" title="Crop and straighten" aria-label="Crop and straighten">⛶</button>
      <button class="icon-btn" id="lb-adjust" title="Adjust light and colour" aria-label="Adjust">◑</button>
      <button class="btn btn-primary sm" id="lb-save" hidden>Save</button>
      <button class="btn ghost sm" id="lb-revert" hidden>Discard</button>
      <span class="stars" id="lb-stars" role="group" aria-label="Rating"></span>
      <span class="labels" id="lb-labels" role="group" aria-label="Colour label"></span>
      <button class="icon-btn" id="lb-info" title="Info" aria-label="Info">ⓘ</button>
      <button class="icon-btn" id="lb-rename" title="Rename" aria-label="Rename">✎</button>
      <button class="icon-btn danger" id="lb-delete" title="Move to Trash" aria-label="Move to Trash">🗑</button>
    </div>
  </div>
  <button class="lb-nav prev" id="lb-prev" aria-label="Previous">‹</button>
  <div class="lb-stage">
    <img id="lb-img" alt="">
    <div class="cropper" id="cropper" hidden>
      <div class="crop-rect" id="crop-rect">
        <span class="ch nw" data-h="nw"></span><span class="ch n" data-h="n"></span><span class="ch ne" data-h="ne"></span>
        <span class="ch w" data-h="w"></span><span class="ch e" data-h="e"></span>
        <span class="ch sw" data-h="sw"></span><span class="ch s" data-h="s"></span><span class="ch se" data-h="se"></span>
      </div>
    </div>
  </div>
  <div class="cropbar" id="cropbar" hidden>
    <span class="croplabel">Crop</span>
    <button class="chip" data-ar="free" aria-pressed="true">Free</button>
    <button class="chip" data-ar="1">1:1</button>
    <button class="chip" data-ar="0.8">4:5</button>
    <button class="chip" data-ar="1.3333">4:3</button>
    <button class="chip" data-ar="1.7778">16:9</button>
    <span class="cropdims num" id="cropdims"></span>
    <span class="bardiv"></span>
    <label class="slider" title="Straighten">
      <span>⟀</span>
      <input type="range" id="straighten" min="-15" max="15" step="0.1" value="0">
      <span class="sval num" id="straighten-val">0°</span>
    </label>
    <button class="btn ghost sm" id="crop-cancel">Cancel</button>
    <button class="btn btn-primary sm" id="crop-done">Done</button>
  </div>

  <div class="adjustbar" id="adjustbar" hidden>
    <span class="croplabel">Adjust</span>
    <!-- Presets are starting points, not modes: each one only sets the three sliders,
         which stay editable afterwards. -->
    <div class="presets" id="adj-presets"></div>
    <label class="slider"><span>☀</span>
      <input type="range" id="adj-brightness" min="-100" max="100" step="1" value="0">
      <span class="sval num" id="adj-brightness-val">0</span></label>
    <label class="slider"><span>◐</span>
      <input type="range" id="adj-contrast" min="-100" max="100" step="1" value="0">
      <span class="sval num" id="adj-contrast-val">0</span></label>
    <label class="slider"><span>❋</span>
      <input type="range" id="adj-saturation" min="-100" max="100" step="1" value="0">
      <span class="sval num" id="adj-saturation-val">0</span></label>
    <button class="btn ghost sm" id="adj-reset">Reset</button>
    <button class="btn btn-primary sm" id="adj-done">Done</button>
  </div>
  <button class="lb-nav next" id="lb-next" aria-label="Next">›</button>
  <aside class="infopanel" id="infopanel" hidden></aside>
  <div class="lb-strip" id="lb-strip"></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head"><h2 id="sheet-title">Organize</h2><button class="icon-btn" id="sheet-close" aria-label="Close">✕</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="selbar" id="selbar" hidden>
  <span class="selcount num" id="selcount"></span>
  <button class="btn ghost sm" id="sel-all">Select all</button>
  <button class="btn ghost sm" id="sel-none">Clear</button>
  <span class="selspacer"></span>
  <button class="btn ghost sm" id="sel-untag" hidden>Not this person</button>
  <button class="btn ghost sm" id="sel-restore" hidden>Restore</button>
  <button class="btn ghost sm danger" id="sel-delete">Move to Trash</button>
</div>

<div class="ctx" id="ctx" hidden role="menu"></div>
<div class="toasts" id="toasts"></div>
<script src="app.js" type="module"></script>
</body>
</html>
