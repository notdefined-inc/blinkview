<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>openfoto</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="titlebar" data-tauri-drag-region>
  <div class="tb-left">
    <span class="logo"></span>
    <span class="wordmark">openfoto</span>
  </div>
  <div class="tb-mid" data-tauri-drag-region><span id="crumb"></span></div>
  <div class="tb-right">
    <div class="searchwrap">
      <input id="search" class="search" type="search"
             placeholder="Try: sam august 2026 · or a scene, like “snowy mountains”" aria-label="Search photos">
      <button class="icon-btn" id="btn-filter" title="Filters" aria-label="Filters">⚟</button>
    </div>
    <button class="icon-btn" id="btn-tools" title="Organize" aria-label="Organize">◈</button>
  </div>
</div>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <section class="nav-block">
      <div class="nav-head"><span>Sources</span><button class="mini" id="btn-add" title="Add a folder">＋</button></div>
      <div id="sources"></div>
    </section>
    <section class="nav-block" id="people-block" hidden>
      <div class="nav-head"><span>People</span><button class="mini" id="btn-review" title="Review people">◎</button></div>
      <div id="people"></div>
      <button class="morelink" id="people-toggle" hidden></button>
    </section>
    <section class="nav-block" id="folders-block" hidden>
      <div class="nav-head"><span>Folders</span></div>
      <div id="folders"></div>
    </section>
    <section class="nav-block" id="trash-block" hidden>
      <div class="nav-head"><span>Trash</span></div>
      <div id="trash"></div>
    </section>
  </aside>

  <main id="main">
    <div class="qchips" id="qchips" hidden></div>
    <div class="filters" id="filters" hidden>
      <div class="frow"><span class="flab">People</span><span class="fopts" id="f-people"></span></div>
      <div class="frow"><span class="flab">When</span><span class="fopts" id="f-when"></span></div>
      <div class="frow"><span class="flab">Rating</span><span class="fopts" id="f-rating"></span></div>
      <div class="frow"><span class="flab">Label</span><span class="fopts" id="f-label"></span></div>
      <div class="frow"><span class="flab">Type</span><span class="fopts" id="f-type"></span></div>
      <div class="frow"><span class="flab">Sort</span><span class="fopts" id="f-sort"></span></div>
    </div>
    <div id="stage"></div>
  </main>
</div>

<div class="lightbox" id="lightbox" hidden>
  <div class="lb-chrome lb-top">
    <button class="icon-btn" id="lb-close" aria-label="Close">✕</button>
    <div class="lb-title"><b id="lb-name"></b><span id="lb-meta"></span></div>
    <div class="lb-actions">
      <span class="lb-zoom num" id="lb-zoom"></span>
      <span class="lb-folder" id="lb-folder"></span>
      <button class="icon-btn" id="lb-rot-l" title="Rotate left" aria-label="Rotate left">⟲</button>
      <button class="icon-btn" id="lb-rot-r" title="Rotate right" aria-label="Rotate right">⟳</button>
      <button class="icon-btn" id="lb-flip" title="Flip horizontally" aria-label="Flip horizontally">⇋</button>
      <button class="icon-btn" id="lb-crop" title="Crop and straighten" aria-label="Crop and straighten">⛶</button>
      <button class="icon-btn" id="lb-adjust" title="Adjust light and colour" aria-label="Adjust">◑</button>
      <button class="btn btn-primary sm" id="lb-save" hidden>Save</button>
      <button class="btn ghost sm" id="lb-revert" hidden>Discard</button>
      <span class="stars" id="lb-stars" role="group" aria-label="Rating"></span>
      <span class="labels" id="lb-labels" role="group" aria-label="Colour label"></span>
      <button class="icon-btn" id="lb-info" title="Info" aria-label="Info">ⓘ</button>
      <button class="icon-btn" id="lb-rename" title="Rename" aria-label="Rename">✎</button>
      <button class="icon-btn danger" id="lb-delete" title="Move to Trash" aria-label="Move to Trash">🗑</button>
    </div>
  </div>
  <button class="lb-nav prev" id="lb-prev" aria-label="Previous">‹</button>
  <div class="lb-stage">
    <img id="lb-img" alt="">
    <div class="cropper" id="cropper" hidden>
      <div class="crop-rect" id="crop-rect">
        <span class="ch nw" data-h="nw"></span><span class="ch n" data-h="n"></span><span class="ch ne" data-h="ne"></span>
        <span class="ch w" data-h="w"></span><span class="ch e" data-h="e"></span>
        <span class="ch sw" data-h="sw"></span><span class="ch s" data-h="s"></span><span class="ch se" data-h="se"></span>
      </div>
    </div>
  </div>
  <div class="cropbar" id="cropbar" hidden>
    <span class="croplabel">Crop</span>
    <button class="chip" data-ar="free" aria-pressed="true">Free</button>
    <button class="chip" data-ar="1">1:1</button>
    <button class="chip" data-ar="0.8">4:5</button>
    <button class="chip" data-ar="1.3333">4:3</button>
    <button class="chip" data-ar="1.7778">16:9</button>
    <span class="cropdims num" id="cropdims"></span>
    <span class="bardiv"></span>
    <label class="slider" title="Straighten">
      <span>⟀</span>
      <input type="range" id="straighten" min="-15" max="15" step="0.1" value="0">
      <span class="sval num" id="straighten-val">0°</span>
    </label>
    <button class="btn ghost sm" id="crop-cancel">Cancel</button>
    <button class="btn btn-primary sm" id="crop-done">Done</button>
  </div>

  <div class="adjustbar" id="adjustbar" hidden>
    <span class="croplabel">Adjust</span>
    <label class="slider"><span>☀</span>
      <input type="range" id="adj-brightness" min="-100" max="100" step="1" value="0">
      <span class="sval num" id="adj-brightness-val">0</span></label>
    <label class="slider"><span>◐</span>
      <input type="range" id="adj-contrast" min="-100" max="100" step="1" value="0">
      <span class="sval num" id="adj-contrast-val">0</span></label>
    <label class="slider"><span>❋</span>
      <input type="range" id="adj-saturation" min="-100" max="100" step="1" value="0">
      <span class="sval num" id="adj-saturation-val">0</span></label>
    <button class="btn ghost sm" id="adj-reset">Reset</button>
    <button class="btn btn-primary sm" id="adj-done">Done</button>
  </div>
  <button class="lb-nav next" id="lb-next" aria-label="Next">›</button>
  <aside class="infopanel" id="infopanel" hidden></aside>
  <div class="lb-strip" id="lb-strip"></div>
</div>

<div class="sheet" id="sheet" hidden>
  <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
    <div class="sheet-head"><h2 id="sheet-title">Organize</h2><button class="icon-btn" id="sheet-close" aria-label="Close">✕</button></div>
    <div class="sheet-body" id="sheet-body"></div>
  </div>
</div>

<div class="selbar" id="selbar" hidden>
  <span class="selcount num" id="selcount"></span>
  <button class="btn ghost sm" id="sel-all">Select all</button>
  <button class="btn ghost sm" id="sel-none">Clear</button>
  <span class="selspacer"></span>
  <button class="btn ghost sm" id="sel-untag" hidden>Not this person</button>
  <button class="btn ghost sm" id="sel-restore" hidden>Restore</button>
  <button class="btn ghost sm danger" id="sel-delete">Move to Trash</button>
</div>

<div class="ctx" id="ctx" hidden role="menu"></div>
<div class="toasts" id="toasts"></div>
<script src="app.js" type="module"></script>
</body>
</html>
