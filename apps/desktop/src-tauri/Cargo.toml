[package]
name = "blinkview-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "blinkview_desktop_lib"
# Desktop only. The staticlib/cdylib targets exist for Tauri mobile and cost ~650MB
# of build artifacts we never link.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blinkview-core = { path = "../../../crates/blinkview-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
chrono = { workspace = true }
http = "1"
notify = { workspace = true }
rayon = { workspace = true }
semver = "1"
ureq = { workspace = true }

# The remote bridge (ADR-0021): an HTTP+WebSocket server the phone's browser talks to.
# axum sits on the tokio runtime Tauri already runs, so this adds no second runtime.
axum = { version = "0.8", features = ["ws"] }
tokio = { version = "1", features = ["rt", "net", "macros", "time", "sync"] }
futures-util = "0.3"
# 128-bit pairing tokens and nothing else.
getrandom = "0.3"
# The pairing QR, rendered to an SVG string with no image dependency.
qrcodegen = "1.8"

# UI-verification bridge. cargo cannot select dependencies on cfg(debug_assertions),
# so this is a real feature, on by default for development and dropped from a release
# build with --no-default-features. Not macOS-only: `build.rs` installs its capability
# wherever the feature is on, so a platform that enabled the feature without the
# dependency failed the build on a permission naming a plugin that was not there.
tauri-plugin-mcp-bridge = { version = "0.12", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
# Narrow native adapters: AppKit supplies the system share picker and `drag` supplies
# real outbound file drags. Both receive only paths resolved from content hashes here.
drag = "2.1.1"
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["NSResponder", "NSSharingService", "NSView", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["NSArray", "NSString", "NSURL"] }

[features]
default = ["ui-bridge"]
ui-bridge = ["dep:tauri-plugin-mcp-bridge"]
