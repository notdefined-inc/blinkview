[package]
name = "openfoto-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "openfoto_desktop_lib"
# Desktop only. The staticlib/cdylib targets exist for Tauri mobile and cost ~650MB
# of build artifacts we never link.
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
openfoto-core = { path = "../../../crates/openfoto-core" }
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
serde = { workspace = true }
serde_json = { workspace = true }
anyhow = { workspace = true }
http = "1"
notify = { workspace = true }
rayon = { workspace = true }

# UI-verification bridge. cargo cannot select dependencies on cfg(debug_assertions),
# so this is a real feature, on by default for development and dropped from a release
# build with --no-default-features.
tauri-plugin-mcp-bridge = { version = "0.12", optional = true }

[features]
default = ["ui-bridge"]
ui-bridge = ["dep:tauri-plugin-mcp-bridge"]
