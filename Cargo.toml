[workspace]
resolver = "2"
members = ["crates/openfoto-core", "crates/openfoto-cli"]

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.85"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
blake3 = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
walkdir = "2"
clap = { version = "4", features = ["derive"] }
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
kamadak-exif = "0.6"
regex = "1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
rayon = "1"
jpeg-decoder = "0.3"
ort = "2.0.0-rc.10"
ndarray = "0.17"
